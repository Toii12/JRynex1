server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/personal_vault?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.vault.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.vault.mapper: debug
