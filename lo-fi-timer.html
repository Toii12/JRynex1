<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>focus</title>
<style>
/* ========== RESET & BASE ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-warm: #f0eadb;
  --win-bg: #ede4d3;
  --win-border-light: #faf7f0;
  --win-border-dark: #c4b59a;
  --title-bg: #d4c5b2;
  --title-text: #4a3f35;
  --text: #4a3f35;
  --text-muted: #8a7e6e;
  --digit: #5a4e3c;
  --btn-bg: #e0d5c0;
  --btn-border-light: #f0e8d8;
  --btn-border-dark: #c8b898;
  --btn-hover-glow: 0 0 12px 3px rgba(210, 190, 155, 0.45);
  --input-bg: #f5efe4;
  --night-sky: #1a1620;
  --night-sky2: #2a2232;
  --window-pane: rgba(20, 16, 28, 0.55);
  --danger-text: #8b6b5a;
}

body {
  font-family: Georgia, 'Times New Roman', 'SimSun', serif;
  background: var(--bg-warm);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  user-select: none;
}

/* ========== RAIN BACKGROUND ========== */
.rain-scene {
  position: fixed; inset: 0; z-index: 0;
  background: linear-gradient(180deg, var(--night-sky) 0%, var(--night-sky2) 70%, #3a3040 100%);
  overflow: hidden;
}

/* window frame overlay */
.rain-scene::before {
  content: ''; position: absolute; inset: 0; z-index: 2;
  background:
    /* horizontal wooden bars */
    linear-gradient(180deg,
      transparent 0%, transparent 3%,
      rgba(60, 45, 35, 0.65) 3%, rgba(60, 45, 35, 0.65) 5.5%,
      transparent 5.5%, transparent 48%,
      rgba(60, 45, 35, 0.65) 48%, rgba(60, 45, 35, 0.65) 50.5%,
      transparent 50.5%, transparent 94.5%,
      rgba(60, 45, 35, 0.65) 94.5%, rgba(60, 45, 35, 0.65) 97%,
      transparent 97%, transparent 100%
    ),
    /* vertical wooden bars */
    linear-gradient(90deg,
      transparent 0%, transparent 3%,
      rgba(60, 45, 35, 0.65) 3%, rgba(60, 45, 35, 0.65) 5.5%,
      transparent 5.5%, transparent 48%,
      rgba(60, 45, 35, 0.65) 48%, rgba(60, 45, 35, 0.65) 50.5%,
      transparent 50.5%, transparent 94.5%,
      rgba(60, 45, 35, 0.65) 94.5%, rgba(60, 45, 35, 0.65) 97%,
      transparent 97%, transparent 100%
    );
  pointer-events: none;
}

/* glass tint */
.rain-scene::after {
  content: ''; position: absolute; inset: 0; z-index: 1;
  background: rgba(12, 10, 20, 0.35);
  pointer-events: none;
}

/* rain drops layer */
.rain-layer { position: absolute; inset: 0; z-index: 3; pointer-events: none; }

.raindrop {
  position: absolute; top: -20px;
  width: 1.5px; height: 14px;
  background: linear-gradient(180deg, transparent 0%, rgba(180, 170, 155, 0.5) 40%, rgba(200, 190, 170, 0.7) 100%);
  border-radius: 0 0 1px 1px;
  animation: fall linear infinite;
  opacity: 0;
}

.raindrop:nth-child(1) { left: 5%; animation-duration: 0.95s; animation-delay: 0s; }
.raindrop:nth-child(2) { left: 12%; animation-duration: 0.78s; animation-delay: 0.12s; }
.raindrop:nth-child(3) { left: 18%; animation-duration: 1.05s; animation-delay: 0.25s; }
.raindrop:nth-child(4) { left: 25%; animation-duration: 0.82s; animation-delay: 0.38s; }
.raindrop:nth-child(5) { left: 32%; animation-duration: 0.91s; animation-delay: 0.05s; }
.raindrop:nth-child(6) { left: 38%; animation-duration: 1.12s; animation-delay: 0.18s; }
.raindrop:nth-child(7) { left: 45%; animation-duration: 0.75s; animation-delay: 0.3s; }
.raindrop:nth-child(8) { left: 52%; animation-duration: 0.98s; animation-delay: 0.08s; }
.raindrop:nth-child(9) { left: 58%; animation-duration: 0.85s; animation-delay: 0.22s; }
.raindrop:nth-child(10) { left: 65%; animation-duration: 1.02s; animation-delay: 0.35s; }
.raindrop:nth-child(11) { left: 72%; animation-duration: 0.79s; animation-delay: 0.15s; }
.raindrop:nth-child(12) { left: 78%; animation-duration: 0.93s; animation-delay: 0.28s; }
.raindrop:nth-child(13) { left: 85%; animation-duration: 1.08s; animation-delay: 0.1s; }
.raindrop:nth-child(14) { left: 92%; animation-duration: 0.87s; animation-delay: 0.2s; }
.raindrop:nth-child(15) { left: 10%; animation-duration: 0.96s; animation-delay: 0.32s; }
.raindrop:nth-child(16) { left: 35%; animation-duration: 0.81s; animation-delay: 0.42s; }
.raindrop:nth-child(17) { left: 55%; animation-duration: 1.1s; animation-delay: 0.17s; }
.raindrop:nth-child(18) { left: 75%; animation-duration: 0.88s; animation-delay: 0.4s; }
.raindrop:nth-child(19) { left: 15%; animation-duration: 0.94s; animation-delay: 0.27s; }
.raindrop:nth-child(20) { left: 62%; animation-duration: 0.83s; animation-delay: 0.45s; }
.raindrop:nth-child(21) { left: 8%; animation-duration: 1.04s; animation-delay: 0.33s; }
.raindrop:nth-child(22) { left: 42%; animation-duration: 0.77s; animation-delay: 0.14s; }
.raindrop:nth-child(23) { left: 68%; animation-duration: 0.99s; animation-delay: 0.36s; }
.raindrop:nth-child(24) { left: 28%; animation-duration: 0.9s; animation-delay: 0.09s; }
.raindrop:nth-child(25) { left: 48%; animation-duration: 0.86s; animation-delay: 0.44s; }
.raindrop:nth-child(26) { left: 82%; animation-duration: 1.06s; animation-delay: 0.21s; }
.raindrop:nth-child(27) { left: 22%; animation-duration: 0.92s; animation-delay: 0.39s; }
.raindrop:nth-child(28) { left: 88%; animation-duration: 0.84s; animation-delay: 0.06s; }
.raindrop:nth-child(29) { left: 95%; animation-duration: 0.97s; animation-delay: 0.29s; }
.raindrop:nth-child(30) { left: 3%; animation-duration: 1.01s; animation-delay: 0.41s; }

@keyframes fall {
  0%   { transform: translateY(-20px); opacity: 0; }
  5%   { opacity: 0.7; }
  80%  { opacity: 0.5; }
  100% { transform: translateY(100vh); opacity: 0; }
}

/* distant city lights */
.city-lights {
  position: absolute; bottom: 8%; left: 5%; right: 5%; z-index: 0;
  height: 3px;
  background: repeating-linear-gradient(90deg,
    rgba(200, 180, 140, 0.2) 0px, rgba(200, 180, 140, 0.2) 2px,
    transparent 2px, transparent 8px,
    rgba(200, 180, 140, 0.15) 8px, rgba(200, 180, 140, 0.15) 9px,
    transparent 9px, transparent 15px,
    rgba(180, 160, 120, 0.18) 15px, rgba(180, 160, 120, 0.18) 17px,
    transparent 17px, transparent 25px
  );
  filter: blur(1px);
}

/* ========== DESKTOP AREA ========== */
.desktop {
  position: fixed; inset: 0 0 36px 0; z-index: 10;
  overflow: hidden;
}

/* ========== WIN95-STYLE WINDOW ========== */
.window {
  width: 520px; min-width: 340px; min-height: 300px;
  background: var(--win-bg);
  border: 2px solid;
  border-color: var(--win-border-light) var(--win-border-dark) var(--win-border-dark) var(--win-border-light);
  box-shadow:
    inset 1px 1px 0 var(--win-border-light),
    inset -1px -1px 0 #b8a88a,
    4px 4px 0 rgba(0,0,0,0.15),
    8px 8px 24px rgba(0,0,0,0.25);
  position: absolute;
  top: calc(50% - 200px); left: calc(50% - 260px);
  font-size: 14px;
  resize: both;
  overflow: auto;
}
.window.maximized {
  top: 0 !important; left: 0 !important;
  width: 100% !important; height: calc(100vh - 36px) !important;
  resize: none;
}

/* title bar */
.title-bar {
  background: var(--title-bg);
  padding: 4px 6px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--win-border-dark);
  cursor: move;
  user-select: none;
}
.title-bar-left {
  display: flex; align-items: center; gap: 6px;
}
.title-bar-icon {
  width: 16px; height: 16px;
  background: var(--win-bg);
  border: 1px solid;
  border-color: var(--win-border-light) var(--win-border-dark) var(--win-border-dark) var(--win-border-light);
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: var(--text-muted);
}
.title-bar-text {
  font-size: 12px; font-weight: bold; color: var(--title-text);
  letter-spacing: 0.5px;
}
.title-bar-controls {
  display: flex; gap: 3px;
}
.title-btn {
  width: 18px; height: 18px;
  background: var(--btn-bg);
  border: 1px solid;
  border-color: var(--btn-border-light) var(--btn-border-dark) var(--btn-border-dark) var(--btn-border-light);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: var(--text);
  cursor: pointer; line-height: 1;
  font-family: sans-serif;
}
.title-btn:hover { border-color: var(--win-border-dark) var(--win-border-light) var(--win-border-light) var(--win-border-dark); }
.title-btn:active {
  border-color: var(--win-border-dark) var(--win-border-light) var(--win-border-light) var(--win-border-dark);
  box-shadow: inset 1px 1px 2px rgba(0,0,0,0.2);
}

/* window body */
.window-body {
  padding: 16px 18px;
  display: flex; flex-direction: column; gap: 14px;
}

/* ========== TIMER DISPLAY ========== */
.timer-section {
  text-align: center;
  padding: 8px 0 4px;
}
.task-name-display {
  font-size: 13px; color: var(--text-muted);
  min-height: 20px; margin-bottom: 4px;
  font-style: italic;
  letter-spacing: 0.3px;
}
.timer-digits {
  font-family: Georgia, 'Times New Roman', 'SimSun', serif;
  font-size: 72px; font-weight: normal;
  color: var(--digit);
  letter-spacing: 4px;
  line-height: 1.1;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.08);
}
.timer-digits.paused { color: var(--text-muted); }
.timer-sep { opacity: 0.5; }

/* ========== TASK INPUT ========== */
.task-input-row {
  display: flex; gap: 8px; align-items: center;
}
.task-name-input {
  flex: 1;
  padding: 6px 10px;
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 13px;
  background: var(--input-bg);
  border: 1px solid;
  border-color: var(--win-border-dark) var(--win-border-light) var(--win-border-light) var(--win-border-dark);
  color: var(--text);
  outline: none;
}
.task-name-input::placeholder { color: var(--text-muted); opacity: 0.6; }
.task-name-input:focus {
  border-color: #b8a070 #e8dcc8 #e8dcc8 #b8a070;
}

.duration-slider-group {
  display: flex; align-items: center; gap: 6px;
  min-width: 140px;
}
.duration-label {
  font-size: 12px; color: var(--text-muted);
  white-space: nowrap;
  min-width: 42px; text-align: right;
}
.duration-slider {
  -webkit-appearance: none;
  width: 80px; height: 4px;
  background: var(--btn-bg);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}
.duration-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px;
  background: var(--title-bg);
  border: 1px solid var(--win-border-dark);
  border-radius: 1px;
  cursor: pointer;
}
.duration-slider::-webkit-slider-thumb:hover {
  background: #c8b898;
}

.add-btn {
  padding: 6px 14px;
  font-family: Georgia, serif; font-size: 12px;
  background: var(--btn-bg);
  border: 1px solid;
  border-color: var(--btn-border-light) var(--btn-border-dark) var(--btn-border-dark) var(--btn-border-light);
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
  transition: box-shadow 0.25s ease, border-color 0.25s ease;
}
.add-btn:hover {
  box-shadow: var(--btn-hover-glow);
  border-color: #d8ccb0 #c4b490 #c4b490 #d8ccb0;
}
.add-btn:active {
  border-color: var(--win-border-dark) var(--win-border-light) var(--win-border-light) var(--win-border-dark);
  box-shadow: inset 1px 1px 2px rgba(0,0,0,0.15);
}

/* ========== TASK QUEUE ========== */
.queue-section { min-height: 60px; }
.queue-label {
  font-size: 11px; color: var(--text-muted);
  margin-bottom: 6px; letter-spacing: 1px;
  text-transform: uppercase;
}
.queue-list { list-style: none; }
.queue-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 5px 10px; margin-bottom: 3px;
  font-size: 13px;
  background: var(--input-bg);
  border: 1px solid var(--btn-border-dark);
}
.queue-item.active {
  background: #e8dcc0;
  border-color: #c8b898;
}
.queue-item.done {
  opacity: 0.5;
  text-decoration: line-through;
  background: transparent;
  border-color: transparent;
}
.queue-item-name { flex: 1; }
.queue-item-duration { font-size: 11px; color: var(--text-muted); margin-right: 8px; }
.queue-item-remove {
  cursor: pointer; font-size: 14px; color: var(--text-muted);
  width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
  border: none; background: none; font-family: sans-serif;
}
.queue-item-remove:hover { color: var(--danger-text); }

.queue-empty {
  font-size: 12px; color: var(--text-muted); opacity: 0.5;
  font-style: italic; padding: 8px 0;
}

/* ========== CONTROLS ========== */
.controls {
  display: flex; gap: 10px; justify-content: center;
  padding: 4px 0;
}
.ctrl-btn {
  padding: 7px 22px;
  font-family: Georgia, serif; font-size: 13px;
  background: var(--btn-bg);
  border: 1px solid;
  border-color: var(--btn-border-light) var(--btn-border-dark) var(--btn-border-dark) var(--btn-border-light);
  color: var(--text);
  cursor: pointer; letter-spacing: 0.5px;
  transition: box-shadow 0.25s ease, border-color 0.25s ease;
}
.ctrl-btn:hover {
  box-shadow: var(--btn-hover-glow);
  border-color: #d8ccb0 #c4b490 #c4b490 #d8ccb0;
}
.ctrl-btn:active {
  border-color: var(--win-border-dark) var(--win-border-light) var(--win-border-light) var(--win-border-dark);
  box-shadow: inset 1px 1px 2px rgba(0,0,0,0.15);
}
.ctrl-btn.primary {
  background: #d4c5b2;
  border-color: #e0d4c0 #b8a880 #b8a880 #e0d4c0;
}
.ctrl-btn.primary:hover {
  box-shadow: 0 0 14px 4px rgba(200, 175, 140, 0.5);
}

/* ========== STATUS BAR ========== */
.status-bar {
  padding: 4px 12px;
  font-size: 11px; color: var(--text-muted);
  border-top: 1px solid var(--win-border-dark);
  display: flex; justify-content: space-between;
  align-items: center;
}
.drawer-trigger {
  cursor: pointer;
  padding: 2px 8px;
  background: var(--btn-bg);
  border: 1px solid;
  border-color: var(--btn-border-light) var(--btn-border-dark) var(--btn-border-dark) var(--btn-border-light);
  font-size: 11px; font-family: Georgia, serif;
  color: var(--text);
  transition: box-shadow 0.25s ease;
}
.drawer-trigger:hover {
  box-shadow: var(--btn-hover-glow);
}

/* ========== DRAWER ========== */
.drawer-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.3);
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
.drawer-overlay.open { opacity: 1; pointer-events: auto; }

.drawer {
  position: fixed; top: 0; right: -360px; z-index: 101;
  width: 360px; height: 100vh;
  background: var(--win-bg);
  border-left: 2px solid;
  border-color: var(--win-border-light) var(--win-border-dark) var(--win-border-dark) var(--win-border-light);
  box-shadow: -4px 0 20px rgba(0,0,0,0.3);
  transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex; flex-direction: column;
}
.drawer.open { right: 0; }

.drawer-header {
  background: var(--title-bg);
  padding: 10px 14px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--win-border-dark);
}
.drawer-title { font-size: 13px; font-weight: bold; color: var(--title-text); }
.drawer-close {
  width: 20px; height: 20px;
  background: var(--btn-bg);
  border: 1px solid;
  border-color: var(--btn-border-light) var(--btn-border-dark) var(--btn-border-dark) var(--btn-border-light);
  cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
  font-family: sans-serif; color: var(--text);
}
.drawer-close:hover { box-shadow: var(--btn-hover-glow); }

.drawer-body {
  flex: 1; overflow-y: auto; padding: 14px;
}
.drawer-body::-webkit-scrollbar { width: 6px; }
.drawer-body::-webkit-scrollbar-track { background: transparent; }
.drawer-body::-webkit-scrollbar-thumb { background: var(--btn-border-dark); }

.record-date {
  font-size: 12px; color: var(--text-muted);
  margin: 12px 0 6px; letter-spacing: 0.5px;
}
.record-date:first-child { margin-top: 0; }
.record-item {
  padding: 6px 10px; margin-bottom: 3px;
  font-size: 12px;
  background: var(--input-bg);
  border: 1px solid var(--btn-border-dark);
  display: flex; justify-content: space-between;
}
.record-task { flex: 1; }
.record-time { color: var(--text-muted); font-size: 11px; }
.record-duration { color: var(--text-muted); font-size: 11px; min-width: 50px; text-align: right; }

.records-empty {
  font-size: 12px; color: var(--text-muted); opacity: 0.5;
  font-style: italic; text-align: center; padding: 30px 0;
}

.record-summary {
  font-size: 12px; color: var(--text-muted);
  padding: 4px 0 8px;
  border-bottom: 1px solid var(--btn-border-dark);
  margin-bottom: 8px;
}

/* ========== WINDOW MINIMIZE ========== */
.window {
  transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.window.minimized {
  opacity: 0;
  transform: scale(0.3);
  pointer-events: none;
}

/* ========== TASKBAR ========== */
.taskbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  height: 36px;
  background: var(--title-bg);
  border-top: 2px solid;
  border-color: var(--win-border-light) var(--win-border-dark) var(--win-border-dark) var(--win-border-light);
  display: flex; align-items: center; padding: 0 4px; gap: 2px;
}
.taskbar-item {
  display: flex; align-items: center; gap: 6px;
  padding: 3px 12px; height: 28px;
  background: var(--btn-bg);
  border: 1px solid;
  border-color: var(--btn-border-light) var(--btn-border-dark) var(--btn-border-dark) var(--btn-border-light);
  color: var(--text); font-size: 11px; font-family: Georgia, serif;
  cursor: pointer; min-width: 120px;
  transition: box-shadow 0.25s ease;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
}
.taskbar-item.visible {
  opacity: 1; pointer-events: auto;
}
.taskbar-item:hover {
  box-shadow: var(--btn-hover-glow);
  border-color: #d8ccb0 #c4b490 #c4b490 #d8ccb0;
}
.taskbar-item:active {
  border-color: var(--win-border-dark) var(--win-border-light) var(--win-border-light) var(--win-border-dark);
  box-shadow: inset 1px 1px 2px rgba(0,0,0,0.15);
}
.taskbar-item-icon {
  width: 16px; height: 16px;
  background: var(--win-bg);
  border: 1px solid;
  border-color: var(--win-border-light) var(--win-border-dark) var(--win-border-dark) var(--win-border-light);
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: var(--text-muted);
}
.taskbar-item.active {
  background: #c8b898;
  border-color: var(--win-border-dark) var(--win-border-light) var(--win-border-light) var(--win-border-dark);
}

/* ========== AUDIO ========== */
.hidden-audio { display: none; }

/* ========== WEATHER DISPLAY ========== */
.weather-icon {
  width: 64px; height: 64px; margin: 0 auto 8px;
  position: relative;
}
/* sun */
.weather-icon.sun { background: radial-gradient(circle at 50% 50%, #d4b896 0%, #d4b896 30%, transparent 31%); }
.weather-icon.sun::before {
  content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: 24px; height: 24px; border-radius: 50%;
  background: #c8a870;
  box-shadow: 0 0 10px 3px rgba(200,168,112,0.4);
}
/* cloud */
.weather-icon.cloud { background: linear-gradient(0deg, rgba(180,160,130,0.5) 60%, transparent 60%); }
.weather-icon.cloud::before {
  content: ''; position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
  width: 40px; height: 22px; border-radius: 20px 20px 0 0;
  background: linear-gradient(0deg, #c4b89a 0%, #d4c5b2 100%);
}
.weather-icon.cloud::after {
  content: ''; position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
  width: 28px; height: 16px; border-radius: 50%;
  background: #d4c5b2;
}
/* cloud-sun */
.weather-icon.cloud-sun {
  background:
    radial-gradient(circle at 28px 20px, #c8a870 0%, #c8a870 8px, transparent 9px),

<script>
// ========== STATE ==========
const state = {
  queue: [],           // { id, name, durationMin, status: 'pending'|'active'|'done' }
  currentIndex: -1,
  remainingSeconds: 0,
  isRunning: false,
  isPaused: false,
  totalSeconds: 0,
  mode: 'idle',       // idle | running | paused | finished
  activeTaskId: null
};

// ========== RAIN ANIMATION ==========
(function initRain() {
  const layer = document.getElementById('rainLayer');
  const drops = ['\u2502','\u2502','\u2502']; // vertical bar chars for varied drops
  for (let i = 0; i < 60; i++) {
    const drop = document.createElement('div');
    drop.className = 'raindrop';
    drop.style.left = (Math.random() * 98) + '%';
    drop.style.animationDuration = (0.65 + Math.random() * 0.9) + 's';
    drop.style.animationDelay = (Math.random() * 1.5) + 's';
    drop.style.height = (8 + Math.random() * 18) + 'px';
    drop.style.opacity = (0.3 + Math.random() * 0.4);
    layer.appendChild(drop);
  }
})();

// ========== DURATION LABEL ==========
function updateDurationLabel() {
  const val = document.getElementById('durationSlider').value;
  document.getElementById('durationLabel').textContent = val + ' min';
}

// ========== TIMER DISPLAY ==========
function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function updateDisplay() {
  document.getElementById('timerDisplay').textContent = formatTime(state.remainingSeconds);
  const display = document.getElementById('timerDisplay');
  if (state.mode === 'paused') {
    display.classList.add('paused');
  } else {
    display.classList.remove('paused');
  }
}

// ========== AUDIO ==========
let audioCtx = null;

function playSingingBowl() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;

    // Fundamental frequencies for a realistic singing bowl
    const fundamentals = [261.6, 329.6, 392.0]; // C4, E4, G4 - gentle chord
    const harmonics = [523.2, 659.2, 784.0, 1046.4]; // octaves up

    fundamentals.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq + (Math.random() - 0.5) * 0.8; // subtle detune for beating
      gain.gain.setValueAtTime(0.12 - i * 0.02, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 3.5 + i * 0.5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 4 + i * 0.5);
    });

    // Soft high harmonics
    [523.2, 659.2].forEach(freq => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq + (Math.random() - 0.5) * 1.2;
      gain.gain.setValueAtTime(0.04, now + 0.3);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + 0.3);
      osc.stop(now + 5.5);
    });
  } catch (e) {
    console.log('Audio error:', e);
  }
}

// ========== TASK QUEUE ==========
function addTask() {
  const nameInput = document.getElementById('taskNameInput');
  const name = nameInput.value.trim();
  if (!name) return;

  const durationMin = parseInt(document.getElementById('durationSlider').value);
  const task = {
    id: Date.now(),
    name: name,
    durationMin: durationMin,
    status: 'pending'
  };

  state.queue.push(task);
  nameInput.value = '';
  nameInput.focus();

  renderQueue();

  // If idle and first task added, set timer
  if (state.mode === 'idle' && state.queue.length === 1) {
    state.remainingSeconds = durationMin * 60;
    state.totalSeconds = state.remainingSeconds;
    updateDisplay();
  }
}

function removeTask(id) {
  if (state.isRunning) return; // can't remove while running
  var idx = state.queue.findIndex(function(t) { return t.id === id; });
  if (idx === -1) return;

  // If removing active or upcoming task while idle, adjust timer
  if (state.mode === 'idle') {
    if (idx <= state.currentIndex + 1 && state.queue.length > 0) {
      var nextPending = state.queue.find(function(t) { return t.status === 'pending'; });
      if (nextPending) {
        state.remainingSeconds = nextPending.durationMin * 60;
        state.totalSeconds = state.remainingSeconds;
      } else {
        state.remainingSeconds = 0;
      }
      updateDisplay();
    }
  }

  state.queue.splice(idx, 1);
  if (state.activeTaskId === id) state.activeTaskId = null;

  // Reset index if needed
  if (state.queue.length === 0) {
    state.currentIndex = -1;
    state.mode = 'idle';
    state.remainingSeconds = 0;
    state.activeTaskId = null;
    document.getElementById('currentTaskName').textContent = '';
    document.getElementById('statusText').textContent = '就绪';
    updateDisplay();
  }

  renderQueue();
}

function renderQueue() {
  const list = document.getElementById('queueList');
  if (state.queue.length === 0) {
    list.innerHTML = '<li class="queue-empty">队列为空，添加一个任务开始专注</li>';
    return;
  }

  list.innerHTML = state.queue.map(function(t, i) {
    var cls = 'queue-item';
    if (t.id === state.activeTaskId && state.isRunning) cls += ' active';
    if (t.status === 'done') cls += ' done';
    var removeBtn = '';
    if (t.status !== 'done' && !state.isRunning) {
      removeBtn = '<button class="queue-item-remove" onclick="removeTask(' + t.id + ')" title="移除">&#10005;</button>';
    }
    var doneMark = t.status === 'done' ? '<span style="font-size:11px;color:var(--text-muted)">&#10003;</span>' : '';
    return '<li class="' + cls + '"><span class="queue-item-name">' + escapeHtml(t.name) + '</span><span class="queue-item-duration">' + t.durationMin + ' min</span>' + doneMark + removeBtn + '</li>';
  }).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ========== TIMER CONTROL ==========
let timerInterval = null;

function startTimer() {
  if (state.isRunning && !state.isPaused) return;
  if (state.queue.length === 0) {
    document.getElementById('statusText').textContent = '请先添加任务';
    document.getElementById('statusText').style.color = 'var(--danger-text)';
    setTimeout(function() {
      var st = document.getElementById('statusText');
      st.textContent = '就绪';
      st.style.color = '';
    }, 2000);
    return;
  }

  // Resume from paused
  if (state.isPaused) {
    state.isPaused = false;
    state.isRunning = true;
    state.mode = 'running';
    document.getElementById('btnPause').textContent = '暂停';
    document.getElementById('statusText').textContent = '计时中...';
    timerInterval = setInterval(function() { tick(); }, 1000);
    renderQueue();
    return;
  }

  // Fresh start - find first pending task
  var pendingIdx = state.queue.findIndex(function(t) { return t.status === 'pending'; });
  if (pendingIdx === -1) {
    document.getElementById('statusText').textContent = '所有任务已完成';
    return;
  }

  state.currentIndex = pendingIdx;
  var task = state.queue[pendingIdx];
  task.status = 'active';
  state.activeTaskId = task.id;
  state.remainingSeconds = task.durationMin * 60;
  state.totalSeconds = state.remainingSeconds;
  state.isRunning = true;
  state.isPaused = false;
  state.mode = 'running';

  document.getElementById('currentTaskName').textContent = task.name;
  document.getElementById('btnPause').textContent = '暂停';
  document.getElementById('statusText').textContent = '计时中...';
  updateDisplay();
  renderQueue();

  timerInterval = setInterval(function() { tick(); }, 1000);
}

function pauseTimer() {
  if (!state.isRunning || state.isPaused) return;
  clearInterval(timerInterval);
  state.isPaused = true;
  state.mode = 'paused';
  document.getElementById('btnPause').textContent = '继续';
  document.getElementById('statusText').textContent = '已暂停';
  updateDisplay();
}

function resetTimer() {
  clearInterval(timerInterval);
  timerInterval = null;

  // Reset all tasks to pending
  for (var i = 0; i < state.queue.length; i++) { state.queue[i].status = 'pending'; }
  state.currentIndex = -1;
  state.activeTaskId = null;
  state.isRunning = false;
  state.isPaused = false;
  state.mode = 'idle';

  if (state.queue.length > 0) {
    state.remainingSeconds = state.queue[0].durationMin * 60;
    state.totalSeconds = state.remainingSeconds;
  } else {
    state.remainingSeconds = 0;
  }

  document.getElementById('currentTaskName').textContent = '';
  document.getElementById('btnPause').textContent = '暂停';
  document.getElementById('statusText').textContent = '就绪';
  updateDisplay();
  renderQueue();
}

function tick() {
  if (state.remainingSeconds <= 0) {
    taskComplete();
    return;
  }
  state.remainingSeconds--;
  updateDisplay();
}

function taskComplete() {
  clearInterval(timerInterval);
  timerInterval = null;

  // Play singing bowl
  playSingingBowl();

  // Mark current task as done + save record
  var completedTask = state.queue.find(function(t) { return t.id === state.activeTaskId; });
  if (completedTask) {
    completedTask.status = 'done';
    saveRecord(completedTask.name, completedTask.durationMin);
  }

  // Find next pending task
  var nextPending = state.queue.find(function(t) { return t.status === 'pending'; });
  if (nextPending) {
    // Move to next task
    nextPending.status = 'active';
    state.activeTaskId = nextPending.id;
    state.currentIndex = state.queue.indexOf(nextPending);
    state.remainingSeconds = nextPending.durationMin * 60;
    state.totalSeconds = state.remainingSeconds;
    state.isRunning = true;
    state.mode = 'running';
    document.getElementById('currentTaskName').textContent = nextPending.name;
    updateDisplay();
    renderQueue();
    timerInterval = setInterval(function() { tick(); }, 1000);
  } else {
    // All done - stop at 0:00
    state.remainingSeconds = 0;
    state.isRunning = false;
    state.isPaused = false;
    state.mode = 'finished';
    state.activeTaskId = null;
    document.getElementById('currentTaskName').textContent = '';
    document.getElementById('btnPause').textContent = '暂停';
    document.getElementById('statusText').textContent = '全部完成';
    updateDisplay();
    renderQueue();
  }
}

// ========== DATA PERSISTENCE ==========
function getTodayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function saveRecord(taskName, durationMin) {
  const key = 'focus_records_' + getTodayKey();
  let records = [];
  try {
    records = JSON.parse(localStorage.getItem(key) || '[]');
  } catch(e) { records = []; }

  records.push({
    task: taskName,
    duration: durationMin,
    time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }),
    timestamp: Date.now()
  });

  localStorage.setItem(key, JSON.stringify(records));
}

function loadTodayRecords() {
  const key = 'focus_records_' + getTodayKey();
  try {
    return JSON.parse(localStorage.getItem(key) || '[]');
  } catch(e) { return []; }
}

function getAllRecords() {
  const records = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith('focus_records_')) {
      const date = key.replace('focus_records_', '');
      try {
        records[date] = JSON.parse(localStorage.getItem(key));
      } catch(e) { records[date] = []; }
    }
  }
  return records;
}

// ========== DRAWER ==========
function toggleDrawer() {
  const drawer = document.getElementById('drawer');
  const overlay = document.getElementById('drawerOverlay');
  const isOpen = drawer.classList.contains('open');
  if (isOpen) {
    drawer.classList.remove('open');
    overlay.classList.remove('open');
  } else {
    renderDrawerRecords();
    drawer.classList.add('open');
    overlay.classList.add('open');
  }
}

function renderDrawerRecords() {
  const body = document.getElementById('drawerBody');
  const todayKey = getTodayKey();
  const records = loadTodayRecords();

  if (records.length === 0) {
    body.innerHTML = '<div class="records-empty">今天还没有专注记录</div>';
    return;
  }

  // Calculate total
  let totalMin = 0;
  records.forEach(r => totalMin += r.duration);

  let html = '<div class="record-summary">';
  html += '今日共完成 <strong>' + records.length + '</strong> 个任务，';
  html += '累计专注 <strong>' + totalMin + '</strong> 分钟';
  html += '</div>';

  html += '<div class="record-date">' + todayKey + '</div>';
  records.forEach(r => {
    html += '<div class="record-item">';
    html += '<span class="record-task">' + escapeHtml(r.task) + '</span>';
    html += '<span class="record-time">' + r.time + '</span>';
    html += '<span class="record-duration">' + r.duration + ' min</span>';
    html += '</div>';
  });

  body.innerHTML = html;
}

// ========== WINDOW MANAGER (multi-window) ==========
function getWindow(id) { return document.getElementById(id); }

function getTaskbarItem(id) {
  return document.querySelector('.taskbar-item[data-window="' + id + '"]');
}

function minimizeWindow(id) {
  var win = getWindow(id);
  var tb = getTaskbarItem(id);
  if (!win || !tb) return;
  win.classList.add('minimized');
  tb.classList.add('visible');
  tb.classList.add('active');
}

function restoreWindow(id) {
  var win = getWindow(id);
  var tb = getTaskbarItem(id);
  if (!win || !tb) return;
  win.classList.remove('minimized');
  tb.classList.remove('visible');
  tb.classList.remove('active');
}

// ========== DRAG (per-window) ==========
var dragState = { dragging: false, win: null, startX: 0, startY: 0, startLeft: 0, startTop: 0 };

function initDrag() {
  var titleBars = document.querySelectorAll('.title-bar[data-window]');
  for (var i = 0; i < titleBars.length; i++) {
    titleBars[i].addEventListener('mousedown', function(e) {
      if (e.target.tagName === 'BUTTON') return;
      var winId = this.getAttribute('data-window');
      var win = getWindow(winId);
      if (!win || win.classList.contains('maximized')) return;
      dragState.dragging = true;
      dragState.win = win;
      dragState.startX = e.clientX;
      dragState.startY = e.clientY;
      dragState.startLeft = win.offsetLeft;
      dragState.startTop = win.offsetTop;
      document.body.style.cursor = 'move';
      document.body.style.userSelect = 'none';
      e.preventDefault();
    });
  }

  document.addEventListener('mousemove', function(e) {
    if (!dragState.dragging || !dragState.win) return;
    var dx = e.clientX - dragState.startX;
    var dy = e.clientY - dragState.startY;
    dragState.win.style.left = Math.max(0, dragState.startLeft + dx) + 'px';
    dragState.win.style.top = Math.max(0, dragState.startTop + dy) + 'px';
  });

  document.addEventListener('mouseup', function() {
    if (!dragState.dragging) return;
    dragState.dragging = false;
    dragState.win = null;
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
}

// ========== MAXIMIZE (per-window state) ==========
var maxStates = {};

function toggleMaximize(id) {
  var win = getWindow(id);
  if (!win || win.classList.contains('minimized')) return;

  if (!maxStates[id]) maxStates[id] = { left: '', top: '', width: '', height: '' };

  if (win.classList.contains('maximized')) {
    win.classList.remove('maximized');
    win.style.left = maxStates[id].left;
    win.style.top = maxStates[id].top;
    win.style.width = maxStates[id].width;
    win.style.height = maxStates[id].height;
  } else {
    maxStates[id].left = win.style.left || (win.offsetLeft + 'px');
    maxStates[id].top = win.style.top || (win.offsetTop + 'px');
    maxStates[id].width = win.style.width || (win.offsetWidth + 'px');
    maxStates[id].height = win.style.height || (win.offsetHeight + 'px');
    win.classList.add('maximized');
  }
}

// ========== TITLE BAR BUTTON HANDLER ==========
function initTitleBarButtons() {
  var buttons = document.querySelectorAll('.title-btn[data-action]');
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].addEventListener('click', function(e) {
      var action = this.getAttribute('data-action');
      // walk up to find the .title-bar to get data-window
      var bar = this.parentElement.parentElement;
      var winId = bar.getAttribute('data-window');
      if (!winId) return;
      if (action === 'minimize') minimizeWindow(winId);
      else if (action === 'maximize') toggleMaximize(winId);
    });
  }
}

// ========== INIT ==========
document.addEventListener('DOMContentLoaded', function() {
  // Set initial timer display
  var sliderVal = document.getElementById('durationSlider').value;
  state.remainingSeconds = sliderVal * 60;
  state.totalSeconds = state.remainingSeconds;
  updateDisplay();

  // Init window system
  initDrag();
  initTitleBarButtons();

  // Load weather data
  loadWeather();

  // Keyboard shortcut: space to start/pause
  document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') {
      e.preventDefault();
      if (state.isRunning && !state.isPaused) {
        pauseTimer();
      } else {
        startTimer();
      }
    }
    if (e.code === 'KeyR' && e.ctrlKey) {
      e.preventDefault();
      resetTimer();
    }
  });
});

// ========== WEATHER LOADER ==========
function loadWeather() {
  if (!window.WEATHER_DATA || !WEATHER_DATA.temp) {
    document.getElementById('weatherCity').textContent = '未获取天气数据';
    document.getElementById('weatherTemp').textContent = '--°';
    return;
  }
  var d = WEATHER_DATA;
  document.getElementById('weatherTemp').textContent = d.temp + '°';
  document.getElementById('weatherCity').textContent = d.city;
  document.getElementById('weatherDesc').textContent = d.desc;
  document.getElementById('weatherUpdated').textContent = '更新: ' + (d.updated || '--');

  // Set weather icon class (remove all, add the right one)
  var iconEl = document.getElementById('weatherIcon');
  iconEl.className = 'weather-icon';
  if (d.icon) iconEl.classList.add(d.icon);
}
</script>
